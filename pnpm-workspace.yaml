# Configuración de pnpm (desde pnpm 10+ estos ajustes viven aquí, no en package.json)

# Dependencias con scripts de instalación aprobados explícitamente
allowBuilds:
  sharp: true
  unrs-resolver: true

# Versiones transitivas forzadas por seguridad: cada una lleva el aviso que corrige.
# Se quitan cuando el paquete que las trae ya exige por sí mismo la versión parchada.
overrides:
  # brace-expansion 1.x llega vía minimatch@3 (dependencias de ESLint). El DoS por
  # arrays intermedios sin límite (GHSA-rgw5-rvv9-x895) esquiva la mitigación de
  # CVE-2026-14257, así que 1.1.17 sigue expuesta; el parche real está en 1.1.18.
  # Después se publicaron otros tres fallos de DoS: recursión sin límite en
  # parseCommaParts (GHSA-6j4f-fj2g-mc7p) y en grupos anidados (GHSA-qhr7-859c-m2p7),
  # y expansión en tiempo cuadrático (GHSA-q2hr-2g5m-vwhr). Todos están corregidos
  # en 1.1.21. La línea 5.x no hace falta forzarla: minimatch 11 ya pide ^5.0.12.
  brace-expansion@1: ^1.1.21
  # browserslist llega vía @babel/core (de styled-jsx y de eslint-plugin-react-hooks). Hasta 4.28.6 arrastra dos
  # fallos: escritura en el prototipo al leer un browserslist-stats.json ajeno
  # (GHSA-73wf-gq98-2v4g) y una caché sin desalojo que crece sin límite
  # (GHSA-c83g-rgw3-j3cx). Parcheados en 4.28.7.
  browserslist: ^4.28.7
  # nanoid llega vía postcss. Con un generador propio y size cero entra en bucle
  # infinito (GHSA-2v37-7h3g-55p8); corregido en 3.3.18.
  nanoid@3: ^3.3.18
  # Next.js pide baseline-browser-mapping ^2.9.19, un rango que admite 2.10.x: esas
  # versiones terminan el proceso ante una entrada inválida (DoS, GHSA-w5vr-8v7q-w6rv).
  # Corregido en 2.11.0.
  baseline-browser-mapping: ^2.11.0
  # source-map-js llega vía postcss (de Next.js y de Tailwind) y vía
  # @tailwindcss/node. Hasta 1.2.1, los offsets de las secciones de un source map
  # indexado bloquean el event loop (DoS, GHSA-68fv-2mgg-jv7q). Corregido en 1.2.2.
  source-map-js: ^1.2.2
  # zod llega vía eslint-config-next > eslint-plugin-react-hooks. Hasta 4.6.5,
  # validar colecciones enormes con restricciones agota la memoria
  # (GHSA-mrhx-c7xc-m3w5). Corregido en 4.6.6.
  zod: ^4.6.6
  # minimatch 10 llega vía @typescript-eslint/typescript-estree (dependencias de
  # ESLint). Hasta 11.0.0, los patrones con muchas partes se amplifican y bloquean
  # el proceso (DoS, GHSA-g3hv-75wg-m249). El parche está en la 11, una versión
  # mayor que typescript-estree todavía no pide: se fuerza porque `pnpm lint`
  # funciona igual con ella. Si una versión de typescript-eslint deja de
  # funcionar con la 11, se quita y el aviso se documenta como aceptado.
  minimatch@10: ^11.0.1

# Avisos que `pnpm audit` ignora a propósito. Cada uno lleva el motivo y la
# condición para quitarlo; si no se cumple el motivo, el aviso se corrige.
auditConfig:
  ignoreGhsas:
    # braces 3.0.3 (vía @next/eslint-plugin-next > fast-glob > micromatch): DoS por
    # agotamiento de pila con patrones muy anidados. Todavía no hay versión
    # parchada. Solo corre en ESLint, sobre los patrones de este repositorio, sin
    # ninguna entrada externa. Quitarlo en cuanto se publique el parche.
    - GHSA-vfj7-8cjw-p6xm
