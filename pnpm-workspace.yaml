# Configuración de pnpm (desde pnpm 10+ estos ajustes viven aquí, no en package.json)

# Dependencias con scripts de instalación aprobados explícitamente
allowBuilds:
  sharp: true
  unrs-resolver: true

# Fuerza una versión parchada de postcss: Next.js fija internamente una versión
# vulnerable a XSS (GHSA-qx2v-qp2m-jg93)
overrides:
  postcss: ^8.5.16
  # brace-expansion llega vía minimatch (dependencias de ESLint), en dos líneas:
  # 1.x por minimatch@3 y 5.x por minimatch@10. El DoS por arrays intermedios sin
  # límite (GHSA-rgw5-rvv9-x895) esquiva la mitigación de CVE-2026-14257, así que
  # 1.1.17 y 5.0.8 siguen expuestas; el parche real está en 1.1.18 y 5.0.9.
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  # browserslist llega vía styled-jsx > @babel/core. Hasta 4.28.6 arrastra dos
  # fallos: escritura en el prototipo al leer un browserslist-stats.json ajeno
  # (GHSA-73wf-gq98-2v4g) y una caché sin desalojo que crece sin límite
  # (GHSA-c83g-rgw3-j3cx). Parcheados en 4.28.7.
  browserslist: ^4.28.7
  # nanoid llega vía postcss. Con un generador propio y size cero entra en bucle
  # infinito (GHSA-2v37-7h3g-55p8); corregido en 3.3.18.
  nanoid@3: ^3.3.18
  # Next.js fija sharp 0.34.x, que arrastra un libvips vulnerable
  # (GHSA-f88m-g3jw-g9cj: CVE-2026-33327/33328/35590/35591). Parcheado en 0.35.0.
  sharp: ^0.35.3
