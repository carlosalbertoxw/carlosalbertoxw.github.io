# Configuración de pnpm (desde pnpm 10+ estos ajustes viven aquí, no en package.json)

# Dependencias con scripts de instalación aprobados explícitamente
allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.17

# Fuerza una versión parchada de postcss: Next.js fija internamente una versión
# vulnerable a XSS (GHSA-qx2v-qp2m-jg93)
overrides:
  postcss: ^8.5.16
  # brace-expansion 1.x llega vía minimatch@3 (dependencias de ESLint). El parche
  # del DoS por expansión sin límite (GHSA-mh99-v99m-4gvg / CVE-2026-14257) se
  # publicó en 5.0.8 y se retroportó a 1.1.17; el aviso aún no lista el backport.
  brace-expansion@1: ^1.1.17
