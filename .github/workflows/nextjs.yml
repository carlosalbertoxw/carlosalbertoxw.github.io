# Workflow para construir y desplegar el sitio Next.js (export estático) a GitHub Pages
#
# Documentación de Next.js: https://nextjs.org/docs/app/building-your-application/deploying/static-exports
#
name: Deploy Next.js site to Pages

on:
  # Se ejecuta en cada push a la rama principal
  push:
    branches: ["main"]

  # Valida los pull requests (incluidos los de Dependabot) sin desplegar
  pull_request:
    branches: ["main"]

  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos por defecto; el job de despliegue pide los suyos
permissions:
  contents: read

jobs:
  # Job de validación y construcción
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # La versión de pnpm se toma del campo "packageManager" de package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Nueva caché cuando cambian las dependencias o los archivos fuente
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # Si solo cambió el código fuente, se restaura una caché anterior
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Falla si alguna dependencia tiene un aviso de severidad alta o crítica
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Build with Next.js
        run: pnpm build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Job de despliegue: solo en push a main, nunca en pull requests
  deploy:
    if: github.event_name != 'pull_request'
    # Permisos del GITHUB_TOKEN para desplegar a GitHub Pages
    permissions:
      pages: write
      id-token: write
    # Solo un despliegue concurrente; no se cancelan los que están en progreso
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
