# Verifica los enlaces del sitio generado una vez por semana. Va aparte del
# workflow de despliegue para que una caída momentánea de un sitio externo no
# bloquee publicaciones: si encuentra enlaces rotos, abre (o actualiza) un issue.
name: Verificar enlaces

on:
  schedule:
    # Lunes a las 14:00 UTC (8:00 en el centro de México)
    - cron: "0 14 * * 1"
  workflow_dispatch:

# Cada job pide solo los permisos que usa
permissions: {}

jobs:
  # Instala dependencias y genera el sitio, así que ejecuta código de terceros:
  # su token solo puede leer el repositorio
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      broken: ${{ steps.lychee.outputs.exit_code != 0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Se revisa el HTML exportado, no el código fuente: es lo que se publica
      - name: Build with Next.js
        run: pnpm build

      # Evita volver a consultar en cada ejecución los enlaces que ya salieron bien
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # --root-dir resuelve las rutas absolutas (/links/) contra out/, e
      # --index-files exige que cada carpeta tenga su index.html. Las redes
      # sociales se excluyen porque bloquean a los bots y darían falsos positivos.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir ${{ github.workspace }}/out
            --index-files index.html
            --include-fragments
            --cache --max-cache-age 1d
            --no-progress
            --exclude 'linkedin\.com|instagram\.com|x\.com|tiktok\.com'
            'out/**/*.html'
          fail: false

      - name: Upload report
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lychee-report
          path: lychee/out.md
          retention-days: 7

  # Solo este job puede escribir issues, y no ejecuta dependencias del proyecto
  report:
    needs: links
    if: needs.links.outputs.broken == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lychee-report

      # Si ya hay un issue abierto de enlaces rotos, se actualiza en lugar de abrir otro
      - name: Find open issue
        id: issue
        run: echo "number=$(gh issue list --label enlaces --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Report broken links
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Enlaces rotos en el sitio
          content-filepath: ./out.md
          issue-number: ${{ steps.issue.outputs.number }}
          labels: enlaces
