# Revisa una vez por semana el sitio publicado, no el código: que las cabeceras de
# seguridad que pone Cloudflare sigan como deben (no viven en este repositorio) y
# que Lighthouse no baje de las metas. Va aparte del despliegue para no bloquear
# publicaciones: si algo falla, el job queda en rojo y abre (o actualiza) un issue.
name: Revisar el sitio publicado

on:
  schedule:
    # Lunes a las 14:30 UTC, después de la verificación de enlaces
    - cron: "30 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Para abrir o actualizar el issue con el reporte
  issues: write

jobs:
  cabeceras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Los valores esperados están en el propio script (ver docs/cloudflare.md)
      - name: Check security headers
        id: headers
        run: |
          set -o pipefail
          bash .github/scripts/check-headers.sh https://carlosalbertoxw.com/ | tee headers.md

      - name: Find open issue
        id: issue
        if: failure() && steps.headers.outcome == 'failure'
        run: echo "number=$(gh issue list --label cabeceras --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report header changes
        if: failure() && steps.headers.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Cabeceras de seguridad distintas a las esperadas
          content-filepath: ./headers.md
          issue-number: ${{ steps.issue.outputs.number }}
          labels: cabeceras

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mide el sitio real, con Cloudflare delante, en tres corridas por página.
      # Las metas (90 en cada categoría) están en .github/lighthouserc.json.
      - name: Run Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            https://carlosalbertoxw.com/
            https://carlosalbertoxw.com/software-development/
            https://carlosalbertoxw.com/git/
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true

      - name: Write report
        if: failure() && steps.lighthouse.outcome == 'failure'
        run: |
          {
            echo "Lighthouse no alcanzó alguna de las metas de \`.github/lighthouserc.json\`."
            echo
            echo "El detalle de cada página está en los artefactos de la ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > lighthouse.md

      - name: Find open issue
        id: issue
        if: failure() && steps.lighthouse.outcome == 'failure'
        run: echo "number=$(gh issue list --label rendimiento --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report Lighthouse results
        if: failure() && steps.lighthouse.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Lighthouse por debajo de las metas
          content-filepath: ./lighthouse.md
          issue-number: ${{ steps.issue.outputs.number }}
          labels: rendimiento
