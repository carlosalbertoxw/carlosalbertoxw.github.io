# Actualizaciones de versión automatizadas. Las de seguridad ya las abre Dependabot
# por su cuenta en cuanto sale un aviso; esto cubre la actualización de rutina.
version: 2
updates:
  # Dependencias de pnpm (Dependabot lee pnpm-lock.yaml con el ecosistema npm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Menores y parches en un solo PR; las versiones mayores llegan por separado
    groups:
      dependencias:
        update-types: ["minor", "patch"]

  # Actions de los workflows, fijadas por SHA; Dependabot actualiza el SHA y el
  # comentario con la versión
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Las de Pages van en su propio PR: no se ejecutan en los pull requests, así
      # que solo se prueban al desplegar y conviene poder revertirlas por separado
      pages:
        patterns:
          - "actions/configure-pages"
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
      actions:
        patterns: ["*"]
        exclude-patterns:
          - "actions/configure-pages"
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
